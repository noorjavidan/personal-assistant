      - name: Unpack project
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP project file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          SPEC=$(find project -name buildozer.spec -type f | head -n1)

          if [ -z "$SPEC" ]; then
            echo "buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
